[project]
name = "release-readiness-backend"
version = "0.1.0"
description = "Release Readiness Agent - FastAPI backend for the A2UI teaching demo"
requires-python = ">=3.12,<3.15"
dependencies = [
    "langchain>=1.4.0,<2",
    "langchain-openai>=1.0.0",
    "langgraph>=1.2.11,<1.3.0",
    "copilotkit==0.1.96",
    "ag-ui-langgraph==0.0.45",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false
